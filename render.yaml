# Render.com Blueprint: New → Blueprint → выберите этот репозиторий
services:
  - type: web
    name: pedkonsilium
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/subjects
    envVars:
      - key: NODE_VERSION
        value: "22"
